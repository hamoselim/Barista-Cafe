<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table - Barista Cafe</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <img src="654300e3648431afe54e45be6aacb208.jpg" alt="Barista Logo" style="height: 44px; width: auto; border-radius: 8px;">
                <span>Barista</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="index.html#hero">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#menu">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                </ul>
                <a href="reservation.html" class="btn btn-warning fw-bold ms-lg-3">Reserve a Table</a>
            </div>
        </div>
    </nav>

    <!-- Reservation Form Section -->
    <main class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow border-0 rounded-3 reservation-card">
                        <div class="card-body p-4 p-sm-5">
                            <h2 class="text-center fw-bold mb-3">Book Your Table Now</h2>
                            <p class="text-center text-muted mb-4">Please fill in the details below to confirm your reservation with us.</p>
                            
                            <form action="#" method="POST">
                                <div class="mb-3">
                                    <label for="full-name" class="form-label font-weight-bold">Full Name</label>
                                    <input type="text" class="form-control" id="full-name" name="full-name" placeholder="Enter your full name" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="01xxxxxxxxx" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="people" class="form-label">Number of Guests</label>
                                        <input type="number" class="form-control" id="people" name="people" min="1" max="20" value="2" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="date" class="form-label">Date</label>
                                        <input type="date" class="form-control" id="date" name="date" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="time" class="form-label">Time</label>
                                        <input type="time" class="form-control" id="time" name="time" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="message" class="form-label">Special Requests (Optional)</label>
                                    <textarea class="form-control" id="message" name="message" rows="3" placeholder="Do you have any special requests?"></textarea>
                                </div>

                                <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Confirm Reservation</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 All rights reserved</p>
        </div>
    </footer>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
